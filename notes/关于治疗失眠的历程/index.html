    <script>const ESSAY = {"folder": "notes", "text": "\u6211\u4e09\u756a\u4e94\u6b21\u5931\u7720\u8fc7\uff0c\u5168\u5386\u7a0b\u8fd8\u662f\u6709\u4e9b\u6f2b\u957f\u7684\uff0c\u6240\u4ee5\u8fd9\u7bc7\u6587\u7ae0\u7cbe\u7b80\u4e00\u4e0b\n\n\u6211\u4ece\u521d\u4e2d\uff0c\u5927\u6982\u521d\u4e8c\u5c31\u5f00\u59cb\u71ac\u591c\uff0c\u5927\u6982\u6bcf\u65e5\u4e8e\u51cc\u6668\u4e00\u70b9\u81f3\u4e24\u70b9\u5165\u7761\uff0c\u8fd8\u7b97\u53ef\u4ee5\n\u5927\u6982\u5230\u4e86\u521d\u4e09\u521d\u56db\uff0c\u6709\u4e86\u70b9\u5fc3\u4e8b\u70e6\u4e8b\u8426\u7ed5\u5fc3\u5934\uff0c\u8fd9\u4e2a\u65f6\u5019\u5f00\u59cb\u5931\u7720\uff0c\u65f6\u95f4\u7ebf\u4ece\u521d\u4e09\u4e00\u76f4\u5230\u9ad8\u4e00\u7684\u516b\u6708\u4efd\u5dee\u4e0d\u591a\n\n#### \u521d\u4e09-\u521d\u56db\n\u8fd9\u90e8\u5206\u4e3b\u8981\u662f\u7531\u4e8e\u5fc3\u4e8b\u3001\u793e\u4ea4\u7b49\u7f18\u6545\u5931\u7720\uff0c\u8fd9\u91cc\u6211\u7684\u65b9\u6cd5\u662fnothing\uff0c\u4e0d\u8fc7\u73b0\u5728\u60f3\u51fa\u4e86\u4e2a\u65b9\u6cd5\uff0c\u5c31\u662f\u793e\u4ea4\u548c\u5fc3\u4e8b\u662f\u65e0\u6cd5\u548c\u6b63\u5e38\u7761\u7720\u5171\u901a\u7684\uff0c\u6240\u4ee5\u6211\u7684\u65b9\u5f0f\u5c31\u662f\u65a9\u65ad\u4e86\u793e\u4ea4\u548c\u5fc3\u4e8b\uff0c\u4e0d\u793e\u4ea4\uff0c\u5219\u65e0\u5fc3\u4e8b\uff0c\u65e0\u5fc3\u4e8b\uff0c\u5219\u4e0d\u793e\u4ea4\n\n\u5f53\u7136\uff0c\u6211\u6307\u7684\u793e\u4ea4\u5927\u591a\u662f\u4e89\u5435\u3001\u8c08\u60c5\u8bf4\u7231\u3001\u601d\u7ef4\u94fe\u8fd9\u6837\u7684\u4e1c\u897f\u4e86\uff0c\u5c31\u4e0d\u8c08\u4ec0\u4e48\u5de5\u4f5c\u4e0a\u5b66\u4e60\u4e0a\u7684\u5408\u4f5c\u4e86\uff0c\u8fd9\u5e94\u8be5\u4e0d\u4f1a\u5f71\u54cd\u5230\u7761\u7720\n\u5fc3\u4e8b\u65b9\u9762\u6709\u4e00\u4e9b\u4eba\u6765\u8052\u566a\u6211\uff0c\u6b64\u5904\u4e0d\u63d0\n\n#### \u9ad8\u4e00\n\u9ad8\u4e00\u5f00\u5b66\u5230\u5b66\u671f\u7ed3\u675f\u538b\u6839\u6ca1\u7761\u8fc7\u597d\u89c9\uff0c\u5927\u90e8\u5206\u90fd\u662f\u5728\u5341\u4e00\u70b9\u4ee5\u540e\uff0c\u4e43\u81f3\u665a\u4e0a\u4e09\u70b9\u4ee5\u540e\u624d\u7761\u7740\n\u8fd9\u6bb5\u65f6\u95f4\u795e\u7ecf\u8870\u5f31\uff0c\u708e\u75c7\u9891\u53d1\uff0c\u6211\u81ea\u5df1\u4e5f\u4e07\u5206\u7126\u8651\uff0c\u5f53\u65f6\u6ca1\u627e\u5230\u5165\u7761\u7684\u597d\u65b9\u6cd5\n\u5176\u6b21\u662f\u793e\u4ea4\u4e0a\u4e5f\u6709\u4e9b\u4eba\u6765\u8052\u566a\u6211\uff0c\u5bfc\u81f4\u6211\u6709\u4e9b\u7cbe\u795e\u5206\u88c2\uff0c\u6709\u6240\u5e7b\u542c\u548c\u795e\u7ecf\u5931\u8c03\u7684\u969c\u788d\uff0c\u8fd9\u76f8\u5f53\u96be\u53d7\uff0c\u4e0d\u8fc7\u540e\u9762\u670d\u836f\uff0c\u5403\u963f\u7acb\u54cc\u5511\uff08\u8fd9\u91cc\u4e0d\u591a\u8d58\u8ff0\u4e86\uff0c\u5185\u5bb9\u592a\u5197\u957f\u4e86\uff0c\u6211\u5403\u7684\u66f2\u6298\u548c\u539f\u56e0\u4e5f\u61d2\u5f97\u5199\u4e86\uff09\n\n\u5927\u6982\u9ad8\u4e00\u7ed3\u675f\uff0c\u6691\u5047\u7684\u65f6\u5019\u6211\u5728\u6d59\u6c5f\uff0c\u8fd9\u4e2a\u65f6\u5019\u6211\u6bcd\u5f00\u59cb\u7ed9\u6211\u5f3a\u884c\u704c\u4e2d\u836f\uff0c\u4e5f\u5bfc\u81f4\u6211\u4e09\u5929\u4e09\u591c\u5408\u4e0d\u4e86\u773c\uff0c\u795e\u7ecf\u8981\u70b8\u4e86\u3002\n\u4fa5\u5e78\u7684\u662f\u6211\u5c45\u7136\u8fd8\u6d3b\u7740\uff0c\u4e0d\u5f97\u4e0d\u9ad8\u5174\u4e24\u4e0b\n\u6211\u5728\u6691\u5047\u7684\u4e00\u4e9b\u597d\u4e8b\u5c31\u662f\u7ecf\u5e38\u548cclaude\u804a\u5929\uff0c\u6211\u5b66\u4e86\u5f88\u591a\u4e1c\u897f\u548c\u65b9\u6cd5\u8bba\uff0c\u5bf9\u6211\u751f\u6d3b\u90fd\u6709\u5207\u5b9e\u7684help\n\n---\n\n\u6691\u5047\u7ed3\u675f\uff0c\u6211\u8fd4\u8fd8\u5c71\u4e1c\uff0c\u8fd9\u4e2a\u65f6\u5019\u6211\u5f00\u59cb\u53d1\u529b\uff0c\u56e0\u4e3a\u6211\u786e\u5b9e\u662f\u627e\u5230\u4e86\u4eba\u751f\u7684\u5feb\u6377\u9053\u8def(\u6551\u8d4e\u4e4b\u9053)\n\u6211\u5230\u5bb6\u7b2c\u4e00\u6b65\u5c31\u662f\u628a\u623f\u95f4\u5367\u5ba4\u7684\u706f\u7ed9\u62c6\u4e86\uff0c\u62c6\u4e86\u4ee5\u540e\u5462\u4e70\u4e865\u65a4\u7315\u7334\u6843\uff0c\u7136\u540e\u6bcf\u6b21\u6211\u90fd\u5173\u7740\u706f\u6d17\u6fa1\u3002\n\uff08\u4e5f\u5c31\u662f\u6bcf\u665a9:20\u540e\u6211\u5c31\u4e0d\u63a5\u89e6\u5927\u9762\u79ef\u5149\u4e86\uff09\n\u8fd9\u4e4b\u540e\u6211\u6bcf\u665a\u7761\u524d1-2h\u54031-2\u9897\u7315\u7334\u6843\n\n\u7136\u540e\u6bcf\u5929\u6211\u5c31\u6210\u529f\u5165\u7761\uff0c\u6cbb\u7597\u4e86\u5931\u7720\u8fd9\u4e00\u95ee\u9898\u4e86\n\u8bf4\u7684\u8f7b\u5feb\uff0c\u5176\u5b9e\u6bcf\u5929\u65e9\u4e0a\u51fa\u6765\u6652\u592a\u9633\u8fd9\u79cd\u4e8b\u60c5\u6ca1\u600e\u4e48\u63d0\uff0c\u8fd9\u53ef\u4ee5\u62e8\u52a8\u4f60\u7684\u751f\u7269\u949f\u63d0\u65e9\n\n\u4e0d\u8fc7\u8fd9\u4e2a\u65f6\u5019\u9700\u8981\u6ce8\u610f\u4e00\u4e0b\uff0c\u90a3\u65f6\uff08\u6691\u5047\u7ed3\u675f\u540e\uff09\u6211\u7684\u7cbe\u795e\u5206\u88c2\u548c\u5e7b\u542c\u75c7\u72b6\u5df2\u7ecf\u975e\u5e38\u5f31\u4e86\uff0c\u65f6\u81f3\u4eca\u65e5\uff0811/19\uff0c\u4e0a\u53489:46\uff09\u6211\u5e76\u6ca1\u6709\u4efb\u4f55\u7cbe\u795e\u5206\u88c2\u75c7\u72b6\u3002\n\n\u6240\u4ee5\uff0c\u5982\u679c\u4f60\u4e5f\u6709\u8fd9\u6837\u6216\u90a3\u6837\u7684\u75be\u75c5\uff0c\u53ef\u80fd\u8981\u5403\u4e00\u4e9b\u9541\u6216\u8005\u9547\u5b9a\u5242\u6216\u8005\u533b\u751f\u5f00\u7684\u836f\u6765\u8f85\u52a9\u7761\u7720\n\n---\n\n\u91cc\u9762\u6ca1\u63d0\u5230\uff0c\u6211\u6cbb\u7597\u7761\u7720\u8fc7\u7a0b\u4e2d\u7528\u8fc7\u892a\u9ed1\u7d20\uff0c\u5f88\u597d\u7528\uff0c\u4e00\u4e2a\u6708\u75285\u6b21\u5c31\u591f\u591a\u4e86\uff0c\u4e0d\u8981\u518d\u7528\u591a\uff0c\u6211\u5bb3\u6015\u4e0a\u763e\n", "time": 1795052899, "title": "\u5173\u4e8e\u6cbb\u7597\u5931\u7720\u7684\u5386\u7a0b"};</script>
